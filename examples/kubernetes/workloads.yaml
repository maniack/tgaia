            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          ports:
            - {name: ops, containerPort: 9090}
          startupProbe:
            httpGet: {path: /healthz, port: ops}
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet: {path: /readyz, port: ops}
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet: {path: /healthz, port: ops}
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/tgaia, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: tgaia-config
                  items: [{key: config.yaml, path: config.yaml}]
              - configMap:
                  name: tgaia-prompt
                  items: [{key: system-prompt.md, path: system-prompt.md}]
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: tgaia-api
spec:
  type: ClusterIP
  selector: {app: tgaia, role: api}
  ports:
    - {name: http, port: 80, targetPort: http}
