apiVersion: apps/v1
kind: Deployment
metadata:
  name: tgaia-api
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: tgaia, role: api}
  template:
    metadata:
      labels: {app: tgaia, role: api}
    spec:
      terminationGracePeriodSeconds: 45
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: tgaia:replace-me
          imagePullPolicy: IfNotPresent
          args: ["--config", "/etc/tgaia/config.yaml", "serve"]
          env:
            - {name: TGAIA_ROLE, value: api}
            - {name: TGAIA_OBSERVABILITY_LISTEN, value: "0.0.0.0:9090"}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          ports:
            - {name: http, containerPort: 8080}
            - {name: ops, containerPort: 9090}
          startupProbe:
            httpGet: {path: /healthz, port: ops}
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet: {path: /readyz, port: ops}
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet: {path: /healthz, port: ops}
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/tgaia, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: tgaia-config
                  items: [{key: config.yaml, path: config.yaml}]
              - configMap:
                  name: tgaia-prompt
                  items: [{key: system-prompt.md, path: system-prompt.md}]
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
---
apiVersion: apps/v1
kind: Deployment
