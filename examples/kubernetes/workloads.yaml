        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: worker
          image: tgaia:replace-me
          imagePullPolicy: IfNotPresent
          args: ["--config", "/etc/tgaia/config.yaml", "serve"]
          env:
            - {name: TGAIA_ROLE, value: worker}
            - {name: TGAIA_OBSERVABILITY_LISTEN, value: "0.0.0.0:9090"}
          securityContext:
